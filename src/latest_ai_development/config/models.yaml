default_provider: ollama
default_model: llama3

providers:
  openai:
    chat_model: gpt-4o-mini
    temperature: 0.3
    top_p: 1.0
    max_tokens: 2000

  anthropicai:
    chat_model: claude-sonnet-4-6
    temperature: 0.7
    max_tokens: 4000

  geminiai:
    chat_model: gemini-2.5-flash
    temperature: 0.7
    max_tokens: 4000

  ollama:
    chat_model: llama3
    temperature: 0.3
    top_p: 1.0
    max_tokens: 2000
