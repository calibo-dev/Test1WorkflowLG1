entry_point: prepare_feedback
end_nodes:
  - finalize_output
final_output_field: final_response

state:
  input:
    user_input:
      type: string
      required: true
  internal:
    errors:
      type: list
      items: string
      reducer: append
      default: []
    validation_status:
      type: string
    normalized_feedback:
      type: string
    sentiment:
      type: string
    confidence:
      type: string
    sentiment_reason:
      type: string
    urgency_score:
      type: integer
      default: 0
    policy_risk_score:
      type: integer
      default: 0
    draft_response:
      type: string
    policy_guidance:
      type: string
    human_decision:
      type: string
  output:
    final_response:
      type: string
    errors:
      type: list
      items: string
      reducer: append
      default: []

persistence:
  enabled: true
  backend: memory

execution:
  save_output: false

runtime_context:
  defaults: {}

nodes:
  prepare_feedback:
    type: deterministic
    builder: latest_ai_development.nodes.orchestration_node_builder:FeedbackOrchestrationNodeBuilder.build_prepare_feedback
  classify_sentiment:
    type: agent
    agent: sentiment_classifier
  evaluate_feedback:
    type: deterministic
    builder: latest_ai_development.nodes.orchestration_node_builder:FeedbackOrchestrationNodeBuilder.build_evaluate_feedback
  appreciation_response:
    type: agent
    agent: appreciation_responder
  clarification_response:
    type: agent
    agent: clarification_responder
  service_recovery_response:
    type: agent
    agent: service_recovery_responder
  policy_guidance:
    type: agent
    agent: policy_advisor
  human_review:
    type: deterministic
    builder: latest_ai_development.nodes.orchestration_node_builder:FeedbackOrchestrationNodeBuilder.build_human_review
  finalize_output:
    type: deterministic
    builder: latest_ai_development.nodes.orchestration_node_builder:FeedbackOrchestrationNodeBuilder.build_finalize_output

edges:
  - from: classify_sentiment
    to: evaluate_feedback
  - from: appreciation_response
    to: finalize_output
  - from: clarification_response
    to: finalize_output
  - from: service_recovery_response
    to: policy_guidance
  - from: policy_guidance
    to: finalize_output
  - from: human_review
    to: finalize_output
  - from: finalize_output
    to: END

conditional_edges:
  - from: prepare_feedback
    decision_field: validation_status
    path_map:
      valid: classify_sentiment
      invalid: finalize_output
  - from: evaluate_feedback
    router: latest_ai_development.nodes.orchestration_node_builder:route_after_evaluation
    path_map:
      appreciation: appreciation_response
      clarification: clarification_response
      service_recovery: service_recovery_response
      human_review: human_review

tracing:
  workflow:
    enabled: true
    name: Customer Feedback Response Workflow
    run_type: chain
    tags:
      - workflow
      - langgraph
    metadata:
      workflow_name: customer_feedback_response
      workflow_version: "1.0"
    input_fields:
      flow_run_id: flow_run_id
      user_input: user_input
    output_fields:
      final_response: final_response
  nodes:
    classify_sentiment:
      enabled: true
      name: Sentiment Classification Node
      run_type: chain
      tags:
        - node
        - classification
    evaluate_feedback:
      enabled: true
      name: Weighted Feedback Evaluation Node
      run_type: chain
      tags:
        - node
        - deterministic
        - routing
